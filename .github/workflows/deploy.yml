name: Deploy to S3

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # TODO: Update this to your bucket's region

      - name: Deploy to S3
        run: |
          # Replace <YOUR_S3_BUCKET_ID> with your actual bucket name when you have it,
          # or better, use a GitHub secret: s3://${{ secrets.S3_BUCKET_NAME }}
          aws s3 sync . s3://<YOUR_S3_BUCKET_ID> --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".idea/*" \
            --exclude ".venv/*" \
            --exclude "README.md"
