name: Deploy to S3

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Warnings show up as annotations on the run. With --strict the deploy
      # stops instead of publishing a gallery that lost all of its images.
      - name: Update screenshot galleries
        run: node scripts/update-galleries.mjs --strict

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Deploy to S3
        run: |
          aws s3 sync . s3://benmega.com --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".idea/*" \
            --exclude ".venv/*" \
            --exclude "scripts/*" \
            --exclude ".githooks/*" \
            --exclude "node_modules/*" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude ".gitignore" \
            --exclude "*.gitkeep" \
            --exclude "README.md"
